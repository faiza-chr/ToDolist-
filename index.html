<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#6d7cff">
  <title>TODO — Mes tâches</title>

  <!-- Favicon intégré (aucun fichier image nécessaire) -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%2355ddff'/%3E%3Cstop offset='1' stop-color='%23c058f3'/%3E%3C/linearGradient%3E%3C/defs%3E%3Ccircle cx='16' cy='16' r='15' fill='url(%23g)'/%3E%3Cpath d='M10 16.5l4 4 8-9' fill='none' stroke='white' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@400;600;700&display=swap">

  <!-- Applique le thème AVANT l'affichage pour éviter un flash blanc -->
  <script>
    (function () {
      var t = null;
      try { t = JSON.parse(localStorage.getItem("theme")); } catch (e) {}
      if (t !== "light" && t !== "dark") {
        t = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      }
      document.documentElement.dataset.theme = t;
    })();
  </script>

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ===================== EN-TÊTE ILLUSTRÉ ===================== -->
  <!-- Paysage en SVG : soleil le jour, lune et étoiles la nuit.
       Les couleurs viennent des variables CSS => elles changent avec le thème. -->
  <header class="hero" id="hero" aria-hidden="true">
    <svg class="hero-art" viewBox="0 0 1440 400" preserveAspectRatio="xMidYMax slice">
      <defs>
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
          <stop class="s1" offset="0"/>
          <stop class="s2" offset="0.55"/>
          <stop class="s3" offset="1"/>
        </linearGradient>
        <radialGradient id="sunGlow">
          <stop offset="0" stop-color="#fff6d6" stop-opacity=".9"/>
          <stop offset="1" stop-color="#ffd27a" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="moonGlow">
          <stop offset="0" stop-color="#d9d4ff" stop-opacity=".55"/>
          <stop offset="1" stop-color="#d9d4ff" stop-opacity="0"/>
        </radialGradient>
        <mask id="crescent">
          <rect width="1440" height="400" fill="white"/>
          <circle cx="1080" cy="106" r="34" fill="black"/>
        </mask>
      </defs>

      <!-- Ciel -->
      <rect class="sky" width="1440" height="400" fill="url(#sky)"/>

      <!-- Étoiles (générées en JS) + étoile filante -->
      <g class="stars" id="stars"></g>
      <line class="shooting" x1="300" y1="40" x2="380" y2="70"/>

      <!-- Soleil / Lune (parallaxe lente) -->
      <g class="layer" style="--depth: 4"><g class="celestial">
        <g class="sun">
          <circle cx="1060" cy="120" r="140" fill="url(#sunGlow)"/>
          <circle cx="1060" cy="120" r="46" fill="#fff1c1"/>
        </g>
        <g class="moon">
          <circle cx="1060" cy="120" r="120" fill="url(#moonGlow)"/>
          <circle cx="1060" cy="120" r="38" fill="#f3f0ff" mask="url(#crescent)"/>
        </g>
      </g></g>

      <!-- Nuages qui dérivent -->
      <g class="layer" style="--depth: 8">
        <g class="clouds">
          <g class="cloud" transform="translate(180 90)">
            <ellipse cx="0" cy="0" rx="70" ry="18"/>
            <ellipse cx="-22" cy="-12" rx="34" ry="20"/>
            <ellipse cx="20" cy="-16" rx="40" ry="24"/>
          </g>
          <g class="cloud desktop-only" transform="translate(760 60) scale(.8)">
            <ellipse cx="0" cy="0" rx="70" ry="18"/>
            <ellipse cx="-22" cy="-12" rx="34" ry="20"/>
            <ellipse cx="20" cy="-16" rx="40" ry="24"/>
          </g>
          <g class="cloud" transform="translate(1300 150) scale(.6)">
            <ellipse cx="0" cy="0" rx="70" ry="18"/>
            <ellipse cx="-22" cy="-12" rx="34" ry="20"/>
            <ellipse cx="20" cy="-16" rx="40" ry="24"/>
          </g>
        </g>
      </g>

      <!-- Montagnes en 3 plans -->
      <path class="layer m1 desktop-only" style="--depth: 12"
        d="M-40 260 C120 210 220 175 340 205 C460 235 520 150 640 140 C760 130 840 210 960 200 C1080 190 1160 115 1280 128 C1360 137 1420 170 1480 182 V400 H-40Z"/>
      <path class="layer m2" style="--depth: 20"
        d="M-40 300 C140 248 260 270 380 240 C500 210 600 282 740 262 C880 242 960 190 1100 220 C1240 250 1340 228 1480 250 V400 H-40Z"/>
      <path class="layer m3" style="--depth: 30"
        d="M-40 340 C160 308 300 330 460 300 C620 270 760 332 920 322 C1080 312 1220 280 1480 312 V400 H-40Z"/>
      <!-- Premier plan : même couleur que la page => fondu parfait -->
      <path class="m4" d="M-40 388 C240 360 480 382 720 372 C960 362 1200 386 1480 372 V400 H-40Z"/>
    </svg>
  </header>

  <!-- ===================== APPLICATION ===================== -->
  <main class="app">

    <div class="app-head">
      <div>
        <h1>TODO</h1>
        <p class="greeting" id="greeting"></p>
      </div>

      <div class="head-actions">
        <!-- Anneau de progression -->
        <div class="ring" id="ring" role="img" aria-label="Progression">
          <svg viewBox="0 0 44 44">
            <circle class="ring-track" cx="22" cy="22" r="19"/>
            <circle class="ring-value" id="ringValue" cx="22" cy="22" r="19"/>
          </svg>
          <span id="ringText">0%</span>
        </div>

        <!-- Bouton jour / nuit -->
        <button class="theme-btn" id="themeBtn" type="button" aria-label="Activer le mode nuit">
          <svg class="icon-moon" viewBox="0 0 26 26" aria-hidden="true">
            <path fill="currentColor" d="M13 0c.81 0 1.603.074 2.373.216C10.593 1.199 7 5.43 7 10.5 7 16.299 11.701 21 17.5 21c2.996 0 5.7-1.255 7.613-3.268C23.22 22.572 18.51 26 13 26 5.82 26 0 20.18 0 13S5.82 0 13 0z"/>
          </svg>
          <svg class="icon-sun" viewBox="0 0 26 26" aria-hidden="true">
            <path fill="currentColor" d="M13 21a1 1 0 011 1v3a1 1 0 11-2 0v-3a1 1 0 011-1zm-5.657-2.343a1 1 0 010 1.414l-2.121 2.121a1 1 0 01-1.414-1.414l2.12-2.121a1 1 0 011.415 0zm12.728 0l2.121 2.121a1 1 0 01-1.414 1.414l-2.121-2.12a1 1 0 011.414-1.415zM13 8a5 5 0 110 10 5 5 0 010-10zm12 4a1 1 0 110 2h-3a1 1 0 110-2h3zM4 12a1 1 0 110 2H1a1 1 0 110-2h3zm18.192-8.192a1 1 0 010 1.414l-2.12 2.121a1 1 0 01-1.415-1.414l2.121-2.121a1 1 0 011.414 0zm-16.97 0l2.121 2.12A1 1 0 015.93 7.344L3.808 5.222a1 1 0 011.414-1.414zM13 0a1 1 0 011 1v3a1 1 0 11-2 0V1a1 1 0 011-1z"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- Nouvelle tâche -->
    <form class="card new-task" id="newTask" autocomplete="off">
      <span class="check preview" aria-hidden="true"></span>
      <label class="sr-only" for="taskInput">Nouvelle tâche</label>
      <input type="text" id="taskInput" maxlength="140" placeholder="Créer une nouvelle tâche…">
      <button type="button" class="swatch-btn" id="newColorBtn" aria-label="Choisir la couleur de la note" aria-haspopup="true"></button>
      <button type="submit" class="add-btn" id="addBtn" aria-label="Ajouter la tâche">
        <svg viewBox="0 0 18 18" aria-hidden="true"><path d="M9 2v14M2 9h14" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
      </button>
    </form>

    <!-- Liste -->
    <section class="card list-card" aria-label="Liste des tâches">
      <ul id="taskList" class="task-list"></ul>

      <div class="empty" id="empty" hidden>
        <svg viewBox="0 0 120 90" aria-hidden="true">
          <rect x="18" y="10" width="84" height="70" rx="10" class="e-paper"/>
          <rect x="32" y="28" width="12" height="12" rx="6" class="e-dot"/>
          <rect x="52" y="31" width="36" height="6" rx="3" class="e-line"/>
          <rect x="32" y="50" width="12" height="12" rx="6" class="e-dot2"/>
          <rect x="52" y="53" width="26" height="6" rx="3" class="e-line"/>
        </svg>
        <p id="emptyText">Rien à faire… pour l'instant !</p>
      </div>

      <div class="list-footer">
        <span id="nbItem" aria-live="polite"></span>

        <div class="filters" role="group" aria-label="Filtrer les tâches">
          <button type="button" data-filter="all" aria-pressed="true">Toutes</button>
          <button type="button" data-filter="active" aria-pressed="false">Actives</button>
          <button type="button" data-filter="completed" aria-pressed="false">Terminées</button>
        </div>

        <button type="button" id="clear" class="clear">Effacer les terminées</button>
      </div>
    </section>

    <footer class="footer">
      <p>Glisser-déposer pour réorganiser · Double-clic pour modifier · <kbd>/</kbd> pour écrire</p>
      <p class="attribution">
        Challenge par <a href="https://www.frontendmentor.io?ref=challenge" target="_blank" rel="noopener">Frontend Mentor</a>.
        Codé par <a href="https://github.com/faiza-chr/">Chrigui Faiza</a>.
      </p>
    </footer>
  </main>

  <!-- Palette de couleurs (partagée, positionnée en JS) -->
  <div class="palette" id="palette" role="dialog" aria-label="Couleur de la note" hidden></div>

  <!-- Notification avec « Annuler » -->
  <div class="toast" id="toast" role="status" aria-live="polite">
    <span id="toastText"></span>
    <button type="button" id="toastAction"></button>
  </div>

  <script src="script.js"></script>
</body>
</html>
